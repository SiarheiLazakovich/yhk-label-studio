# Публикация на GitHub Pages: при пуше в main собирает статические файлы приложения и деплоит.
# В репозитории: Settings → Pages → Source: «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons fonts _site/
          # версия кэша service worker = короткий SHA коммита, чтобы клиенты получали обновления
          sed -i "s/const VERSION = \".*\";/const VERSION = \"${GITHUB_SHA::8}\";/" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
